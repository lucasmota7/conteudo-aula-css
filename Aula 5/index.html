<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Aula 5/css/style.css">
    <title>FlexBox CSS</title>
</head>
<body>
    <h1>Flex Items CSS</h1>
    <p>EXEMPLOS DE FLEX ITEMS</p>

    <div class="ex1">
        <div style="order: 4;">ITEM 1</div>
        <div style="order: 3;">ITEM 2</div>
        <div style="order: 2;">ITEM 3</div>
        <div style="order: 1;">ITEM 4</div>
     </div>
    
     <hr>
     
    <div class="ex2">
        <div style="flex-grow: 1;">ITEM 1</div>
        <div style="flex-grow: 2;">ITEM 2</div>
        <div style="flex-grow: 3;">ITEM 3</div>
    </div>

    <hr>

    <div class="ex3">
        <div>ITEM 1</div>
        <div style="flex-shrink: 2;">ITEM 2</div>
        <div>ITEM 3</div>
        <div style="flex-shrink: 2;">ITEM 4</div>
        <div>ITEM 5</div>
    </div>

    <hr>

    <div class="ex4">
        <div>ITEM 1</div>
        <div>ITEM 2</div>
        <div style="flex-basis: 200px;">ITEM 3</div>
        <div>ITEM 4</div>
    </div>

    <hr>

    <div class="ex5">
        <div>ITEM 1</div>
        <div>ITEM 2</div>
        <div id="it3">ITEM 3</div>
        <div>ITEM 4</div>
    </div>

    <hr>


    <div class="ex6">
        <div>ITEM 1</div>
        <div id="item2">ITEM 3</div>
        <div id="item3">ITEM 3</div>
        <div id="item4">ITEM 3</div>
        <div>ITEM 5</div>
    </div>

    <hr>


</body>
</html>
